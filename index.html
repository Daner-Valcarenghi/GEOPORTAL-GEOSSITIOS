<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GEOPORTAL</title>

    <!-- OpenLayers CSS/JS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@v10.6.1/ol.css">
    <script src="https://cdn.jsdelivr.net/npm/ol@v10.6.1/dist/ol.js"></script>

    <!-- JSZip (Necessário para descompactar o arquivo KMZ) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

    <style>
        html, body { 
            margin: 0; 
            padding: 0; 
            width: 100%; 
            height: 100%; 
            font-family: Arial, sans-serif; 
            overflow: hidden;
        }

        #map { 
            width: 100%; 
            height: 100%; 
        }

        /* Título */
        .map-title {
            position: absolute;
            top: 10px;
            left: 50px;
            z-index: 999;
            background: rgba(255, 255, 255, 0.95);
            padding: 6px 12px;
            border-radius: 6px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.25);
            border: 1px solid #cccccc;
            pointer-events: auto;
            max-width: calc(100% - 320px);
        }

        .map-title h1 {
            margin: 0;
            font-size: 15px;
            font-weight: bold;
            color: #1a252f;
            text-transform: uppercase;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .map-title h2 {
            margin: 1px 0 0 0;
            font-size: 12px;
            font-weight: normal;
            color: #555555;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .ol-zoom {
            top: 10px !important;
            left: 10px !important;
        }

        @media (max-width: 600px) {
            .map-title {
                left: 50px;
                top: 10px;
                padding: 4px 8px;
                max-width: 180px;
            }
            .map-title h1 { 
                font-size: 14px; 
            }
            .map-title h2 { 
                font-size: 10px; 
            }
        }

        /* Popup */
        .ol-popup {
            position: absolute;
            background-color: #ffffff;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #cccccc;
            bottom: 12px;
            left: -50px;
            min-width: 240px;
            max-width: 320px;
            max-height: 400px;
            overflow-y: auto;
        }
        
        .ol-popup-closer { 
            text-decoration: none; 
            position: absolute; 
            top: 4px; 
            right: 8px; 
            color: #888888; 
            font-weight: bold; 
        }

        /* Menu de Camadas */
        .map-menu-container {
            position: absolute;
            top: 10px;
            right: 10px;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
        }

        .menu-toggle-btn {
            background: #ffffff;
            border: 1px solid #ccc;
            border-radius: 6px;
            padding: 6px 10px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            display: flex;
            align-items: center;
            gap: 5px;
            user-select: none;
        }
        .menu-toggle-btn:hover { background: #f0f0f0; }

        .map-menu {
            background: rgba(255, 255, 255, 0.95);
            padding: 12px 16px;
            border-radius: 6px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
            font-size: 13px;
            line-height: 1.5;
            margin-top: 5px;
            width: 250px;
            max-height: 80vh;
            overflow-y: auto;
            transition: all 0.3s ease-in-out;
        }

        .map-menu.collapsed { display: none; }

        .layer-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 4px;
        }

        .layer-label {
            display: flex;
            align-items: center;
            gap: 4px;
            cursor: pointer;
        }

        .geosites-list {
            margin-top: 4px;
            margin-left: 18px;
            padding-left: 6px;
            border-left: 2px solid #e0e0e0;
            max-height: 180px;
            overflow-y: auto;
        }

        .geosite-item {
            padding: 3px 6px;
            font-size: 12px;
            color: #007bff;
            cursor: pointer;
            border-radius: 3px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            transition: background 0.2s;
        }

        .geosite-item:hover {
            background: #eef5ff;
            text-decoration: underline;
            color: #0056b3;
        }

        .menu-section {
            margin-top: 8px;
            padding-top: 8px;
            border-top: 1px solid #e0e0e0;
        }

        .measure-btn {
            background: #007bff;
            color: #ffffff;
            border: none;
            padding: 5px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 11px;
            margin-right: 2px;
            margin-top: 4px;
        }
        .measure-btn:hover { background: #0056b3; }

        .location-btn {
            position: absolute;
            bottom: 80px;
            right: 10px;
            background: rgba(255, 255, 255, 0.9);
            border: 1px solid #ccc;
            border-radius: 50%;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
            z-index: 1000;
            width: 36px;
            height: 36px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            user-select: none;
        }

        .north-arrow-btn {
            position: absolute;
            bottom: 35px;
            right: 10px;
            background: rgba(255, 255, 255, 0.9);
            border: 1px solid #ccc;
            border-radius: 50%;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
            z-index: 1000;
            width: 36px;
            height: 36px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 14px;
            user-select: none;
            transition: transform 0.1s linear;
        }

        .ol-scale-line {
            left: 10px !important;
            bottom: 10px !important;
            background: rgba(0, 60, 136, 0.7) !important;
        }
    </style>
</head>

<body>

<div class="map-title">
    <h1>GEOSSÍTIOS</h1>
    <h2>Geoparque Caçapava do Sul</h2>
</div>

<div id="map"></div>

<!-- Popup -->
<div id="popup" class="ol-popup">
    <a href="#" id="popup-closer" class="ol-popup-closer">✕</a>
    <div id="popup-content"></div>
</div>

<button id="btn-location" class="location-btn" title="Minha Localização">🎯</button>
<button id="btn-north" class="north-arrow-btn" title="Reorientar para o Norte">N ↑</button>

<div class="map-menu-container">
    <button id="btn-toggle-menu" class="menu-toggle-btn">
        <span>Camadas & Ferramentas</span>
        <span id="toggle-icon">▲</span>
    </button>

    <div id="map-menu" class="map-menu collapsed">
        <div>
            <b>Camadas Vetoriais:</b><br>
            <div class="layer-item">
                <label class="layer-label">
                    <input type="checkbox" id="chk-kmz" checked> Geossítios (KMZ)
                </label>
            </div>
            
            <div id="geosites-container" class="geosites-list"></div>

            <div class="layer-item" style="margin-top: 6px;">
                <label class="layer-label">
                    <input type="checkbox" id="chk-limite" checked> Limite Municipal
                </label>
            </div>

            <div class="layer-item" style="margin-top: 6px;">
                <label class="layer-label">
                    <input type="checkbox" id="chk-distritos" checked> Distritos (IBGE)
                </label>
            </div>
        </div>

        <div class="menu-section">
            <b>Fundo de Mapa:</b><br>
            <input type="radio" id="osm" name="baseMap" value="osm" checked>
            <label for="osm">OpenStreetMap</label><br>
            <input type="radio" id="satelite" name="baseMap" value="satelite">
            <label for="satelite">Satélite (Esri)</label>
        </div>

        <div class="menu-section">
            <b>Ferramentas de Medição:</b><br>
            <button id="btn-dist" class="measure-btn">Distância</button>
            <button id="btn-area" class="measure-btn">Área</button>
            <button id="btn-clear" class="measure-btn" style="background:#6c757d;">Limpar</button>
        </div>
    </div>
</div>

<script>
    // 1. Camadas Base
    const osmLayer = new ol.layer.Tile({
        source: new ol.source.OSM(),
        visible: true
    });

    const sateliteLayer = new ol.layer.Tile({
        source: new ol.source.XYZ({
            url: 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
            maxZoom: 19,
            attributions: 'Tiles © Esri'
        }),
        visible: false
    });

    // 2. Estilo e Fonte dos Limites Municipais
    const limiteMunicipalStyle = [
        new ol.style.Style({
            stroke: new ol.style.Stroke({ color: '#000000', width: 5 })
        }),
        new ol.style.Style({
            stroke: new ol.style.Stroke({ color: '#ff0055', width: 2.5, lineDash: [8, 6] })
        })
    ];

    const limiteSource = new ol.source.Vector();
    const limiteLayer = new ol.layer.Vector({
        source: limiteSource,
        style: limiteMunicipalStyle,
        zIndex: 5
    });

    fetch('https://nominatim.openstreetmap.org/search?city=Caçapava+do+Sul&state=Rio+Grande+do+Sul&country=Brazil&polygon_geojson=1&format=json')
        .then(res => res.json())
        .then(data => {
            if (data && data.length > 0) {
                const geojsonFormat = new ol.format.GeoJSON();
                const feature = geojsonFormat.readFeature({
                    type: 'Feature',
                    geometry: data[0].geojson
                }, {
                    dataProjection: 'EPSG:4326',
                    featureProjection: 'EPSG:3857'
                });
                limiteSource.addFeature(feature);

                map.getView().fit(limiteSource.getExtent(), {
                    padding: [40, 40, 40, 40],
                    duration: 1000
                });
            }
        })
        .catch(err => console.error('Erro ao carregar o limite municipal:', err));

    // 3. Estilo e Fonte dos Distritos (IBGE)
    const distritosSource = new ol.source.Vector({
        url: 'distritos.geojson', // Arquivo gerado a partir do GeoPackage do IBGE
        format: new ol.format.GeoJSON({
            dataProjection: 'EPSG:4326',
            featureProjection: 'EPSG:3857'
        })
    });

    const distritosLayer = new ol.layer.Vector({
        source: distritosSource,
        style: function(feature) {
            // Tenta pegar o nome do distrito/subdistrito nos atributos padrões do IBGE (NM_SUBDIST, NM_DIST, etc.)
            const nomeDistrito = feature.get('NM_SUBDIST') || feature.get('NM_DIST') || feature.get('NM_DISTITO') || '';
            
            return new ol.style.Style({
                stroke: new ol.style.Stroke({
                    color: '#2b5c8f',
                    width: 1.8,
                    lineDash: [6, 4]
                }),
                fill: new ol.style.Fill({
                    color: 'rgba(43, 92, 143, 0.08)'
                }),
                text: new ol.style.Text({
                    text: nomeDistrito,
                    font: 'bold 11px Arial, sans-serif',
                    fill: new ol.style.Fill({ color: '#1a252f' }),
                    stroke: new ol.style.Stroke({ color: '#ffffff', width: 3 }),
                    overflow: true
                })
            });
        },
        zIndex: 4
    });

    // 4. Estilo Padrão para os Geossítios
    const defaultPointStyle = new ol.style.Style({
        image: new ol.style.Circle({
            radius: 7,
            fill: new ol.style.Fill({ color: '#e74c3c' }),
            stroke: new ol.style.Stroke({ color: '#ffffff', width: 2 })
        }),
        stroke: new ol.style.Stroke({ color: '#2980b9', width: 3 }),
        fill: new ol.style.Fill({ color: 'rgba(41, 128, 185, 0.3)' })
    });

    // 5. Fonte e Camada do KMZ
    const kmzSource = new ol.source.Vector();
    const kmzLayer = new ol.layer.Vector({
        source: kmzSource,
        style: defaultPointStyle,
        zIndex: 10
    });

    const NOME_DO_ARQUIVO_KMZ = 'mapa.kmz';

    fetch(NOME_DO_ARQUIVO_KMZ)
        .then(response => {
            if (!response.ok) throw new Error(`Falha HTTP ${response.status}`);
            return response.arrayBuffer();
        })
        .then(buffer => JSZip.loadAsync(buffer))
        .then(zip => {
            const kmlFileName = Object.keys(zip.files).find(name => name.toLowerCase().endsWith('.kml'));
            if (!kmlFileName) throw new Error('KML não encontrado.');
            return zip.files[kmlFileName].async('string');
        })
        .then(kmlText => {
            const format = new ol.format.KML({ extractStyles: false, extractAttributes: true });
            const features = format.readFeatures(kmlText, {
                dataProjection: 'EPSG:4326',
                featureProjection: 'EPSG:3857'
            });

            kmzSource.addFeatures(features);
            buildGeositesMenuList(features);
        })
        .catch(err => console.error('Erro no KMZ:', err));

    // 6. Medição
    const measureSource = new ol.source.Vector();
    const measureLayer = new ol.layer.Vector({
        source: measureSource,
        style: new ol.style.Style({
            fill: new ol.style.Fill({ color: 'rgba(255, 255, 255, 0.2)' }),
            stroke: new ol.style.Stroke({ color: '#ffcc33', width: 3 }),
            image: new ol.style.Circle({ radius: 6, fill: new ol.style.Fill({ color: '#ffcc33' }) })
        }),
        zIndex: 15
    });

    // 7. Geolocalização
    const positionFeature = new ol.Feature();
    positionFeature.setStyle(new ol.style.Style({
        image: new ol.style.Circle({
            radius: 8,
            fill: new ol.style.Fill({ color: '#007bff' }),
            stroke: new ol.style.Stroke({ color: '#ffffff', width: 3 })
        })
    }));

    const accuracyFeature = new ol.Feature();
    accuracyFeature.setStyle(new ol.style.Style({
        fill: new ol.style.Fill({ color: 'rgba(0, 123, 255, 0.15)' }),
        stroke: new ol.style.Stroke({ color: 'rgba(0, 123, 255, 0.4)', width: 1 })
    }));

    const locationSource = new ol.source.Vector({ features: [accuracyFeature, positionFeature] });
    const locationLayer = new ol.layer.Vector({ source: locationSource, zIndex: 20 });

    // 8. Popup
    const popupContainer = document.getElementById('popup');
    const popupContent = document.getElementById('popup-content');
    const popupCloser = document.getElementById('popup-closer');

    const overlay = new ol.Overlay({
        element: popupContainer,
        autoPan: { animation: { duration: 250 } }
    });

    popupCloser.onclick = function () {
        overlay.setPosition(undefined);
        popupCloser.blur();
        return false;
    };

    // 9. Instância do Mapa
    const scaleLineControl = new ol.control.ScaleLine({ units: 'metric', minWidth: 140 });

    const view = new ol.View({
        center: ol.proj.fromLonLat([-53.4831, -30.5122]),
        zoom: 10,
        enableRotation: true
    });

    const map = new ol.Map({
        target: 'map',
        controls: ol.control.defaults.defaults().extend([scaleLineControl]),
        layers: [osmLayer, sateliteLayer, distritosLayer, limiteLayer, kmzLayer, measureLayer, locationLayer],
        overlays: [overlay],
        view: view
    });

    function formatPopupDescription(text) {
        if (!text) return '';
        let cleanedText = text.replace(/<img[^>]*>/gi, '');
        const urlRegex = /(https?:\/\/[^\s<]+)/g;
        return cleanedText.replace(urlRegex, function(url) {
            return `<a href="${url}" target="_blank" rel="noopener noreferrer">${url}</a>`;
        });
    }

    function showFeaturePopup(feature) {
        const name = feature.get('name') || feature.get('NM_SUBDIST') || feature.get('NM_DIST') || 'Sem Nome';
        let description = feature.get('description') || '';

        let htmlContent = `<h3 style="margin:0 0 8px 0; font-size:14px; color:#007bff;">${name}</h3>`;
        
        if (description) {
            const processedDescription = formatPopupDescription(description);
            htmlContent += `<div style="font-size:12px; line-height:1.4; word-break: break-all;">${processedDescription}</div>`;
        } else {
            htmlContent += '<p style="font-size:12px; color:#666;">Nenhuma descrição cadastrada.</p>';
        }

        popupContent.innerHTML = htmlContent;

        const links = popupContent.querySelectorAll('a');
        links.forEach(link => {
            link.setAttribute('target', '_blank');
            link.setAttribute('rel', 'noopener noreferrer');
        });

        const geometry = feature.getGeometry();
        let coordinate;
        if (geometry.getType() === 'Point') {
            coordinate = geometry.getCoordinates();
        } else {
            coordinate = ol.extent.getCenter(geometry.getExtent());
        }

        overlay.setPosition(coordinate);
    }

    // Clique no Mapa
    map.on('singleclick', function (evt) {
        if (draw) return;

        const feature = map.forEachFeatureAtPixel(evt.pixel, f => f, {
            layerFilter: layer => layer === kmzLayer || layer === distritosLayer
        });

        if (feature) {
            showFeaturePopup(feature);
        } else {
            overlay.setPosition(undefined);
        }
    });

    // Lista de Geossítios
    function buildGeositesMenuList(features) {
        const container = document.getElementById('geosites-container');
        container.innerHTML = '';

        const validFeatures = features.filter(f => f.get('name'));
        validFeatures.sort((a, b) => (a.get('name') || '').localeCompare(b.get('name') || ''));

        validFeatures.forEach(feature => {
            const name = feature.get('name');
            const item = document.createElement('div');
            item.className = 'geosite-item';
            item.textContent = `📍 ${name}`;

            item.onclick = function () {
                const geom = feature.getGeometry();
                if (geom) {
                    let targetCoords = geom.getType() === 'Point' ? geom.getCoordinates() : ol.extent.getCenter(geom.getExtent());
                    map.getView().animate({ center: targetCoords, zoom: 16, duration: 1000 });
                    showFeaturePopup(feature);
                }
            };
            container.appendChild(item);
        });
    }

    // 10. Controles da Interface
    document.getElementById('chk-kmz').addEventListener('change', e => {
        const isVisible = e.target.checked;
        kmzLayer.setVisible(isVisible);
        document.getElementById('geosites-container').style.display = isVisible ? 'block' : 'none';
        if (!isVisible) overlay.setPosition(undefined);
    });

    document.getElementById('chk-limite').addEventListener('change', e => limiteLayer.setVisible(e.target.checked));
    document.getElementById('chk-distritos').addEventListener('change', e => distritosLayer.setVisible(e.target.checked));

    document.querySelectorAll('input[name="baseMap"]').forEach(elem => {
        elem.addEventListener('change', e => {
            osmLayer.setVisible(e.target.value === 'osm');
            sateliteLayer.setVisible(e.target.value === 'satelite');
        });
    });

    const menuToggleBtn = document.getElementById('btn-toggle-menu');
    const mapMenu = document.getElementById('map-menu');
    const toggleIcon = document.getElementById('toggle-icon');

    menuToggleBtn.onclick = function () {
        mapMenu.classList.toggle('collapsed');
        toggleIcon.textContent = mapMenu.classList.contains('collapsed') ? '▲' : '▼';
    };

    // Botões Flutuantes
    const northBtn = document.getElementById('btn-north');
    view.on('change:rotation', () => northBtn.style.transform = `rotate(${view.getRotation()}rad)`);
    northBtn.onclick = () => map.getView().animate({ rotation: 0, duration: 350 });

    const geolocation = new ol.Geolocation({ trackingOptions: { enableHighAccuracy: true }, projection: view.getProjection() });
    geolocation.on('change:accuracyGeometry', () => accuracyFeature.setGeometry(geolocation.getAccuracyGeometry()));
    geolocation.on('change:position', () => {
        const coords = geolocation.getPosition();
        positionFeature.setGeometry(coords ? new ol.Point(coords) : null);
    });

    document.getElementById('btn-location').onclick = function () {
        geolocation.setTracking(true);
        const coords = geolocation.getPosition();
        if (coords) {
            map.getView().animate({ center: coords, zoom: 16, duration: 1000 });
        } else {
            geolocation.once('change:position', () => {
                const pos = geolocation.getPosition();
                if (pos) map.getView().animate({ center: pos, zoom: 16, duration: 1000 });
            });
        }
    };

    // 11. Medição
    let draw;
    function addInteraction(type) {
        if (draw) map.removeInteraction(draw);
        draw = new ol.interaction.Draw({ source: measureSource, type: type });
        draw.on('drawend', function (evt) {
            const geom = evt.feature.getGeometry();
            let output;
            if (type === 'LineString') {
                const length = ol.sphere.getLength(geom);
                output = length > 1000 ? (length / 1000).toFixed(2) + ' km' : length.toFixed(2) + ' m';
                alert('Distância Medida: ' + output);
            } else if (type === 'Polygon') {
                const area = ol.sphere.getArea(geom);
                output = area > 10000 ? (area / 10000).toFixed(2) + ' ha' : area.toFixed(2) + ' m²';
                alert('Área Medida: ' + output);
            }
            map.removeInteraction(draw);
            draw = null;
        });
        map.addInteraction(draw);
    }

    document.getElementById('btn-dist').onclick = () => addInteraction('LineString');
    document.getElementById('btn-area').onclick = () => addInteraction('Polygon');
    document.getElementById('btn-clear').onclick = () => {
        if (draw) { map.removeInteraction(draw); draw = null; }
        measureSource.clear();
    };
</script>

</body>
</html>
